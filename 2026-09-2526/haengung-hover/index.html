<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hängung</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="kopf">
    <h1>Hängung</h1>
    <p>Raster 4 × 3. Hover vergrössert Spalte und Zeile des Bildes.</p>
  </header>

  <main>
    <!--
      12 Bilder = 4 Spalten × 3 Zeilen.
      Reihenfolge im HTML = Reihenfolge an der Wand:
      Zeile 1: Bild 1–4, Zeile 2: Bild 5–8, Zeile 3: Bild 9–12.

      Eigene Bilder: in images/ legen, src und alt anpassen.

      Anders layouten, verteilen, mit Weissraum, mit Überlagerung usw.
    -->
    <div class="wand">
      <figure class="bild"><img src="images/bild-01.jpg" alt="Bild 1"></figure>
      <figure class="bild"><img src="images/bild-02.jpg" alt="Bild 2"></figure>
      <figure class="bild"><img src="images/bild-03.jpg" alt="Bild 3"></figure>
      <figure class="bild"><img src="images/bild-04.jpg" alt="Bild 4"></figure>

      <figure class="bild"><img src="images/bild-05.jpg" alt="Bild 5"></figure>
      <figure class="bild"><img src="images/bild-06.jpg" alt="Bild 6"></figure>
      <figure class="bild"><img src="images/bild-07.jpg" alt="Bild 7"></figure>
      <figure class="bild"><img src="images/bild-08.jpg" alt="Bild 8"></figure>

      <figure class="bild"><img src="images/bild-09.jpg" alt="Bild 9"></figure>
      <figure class="bild"><img src="images/bild-10.jpg" alt="Bild 10"></figure>
      <figure class="bild"><img src="images/bild-11.jpg" alt="Bild 11"></figure>
      <figure class="bild"><img src="images/bild-12.jpg" alt="Bild 12"></figure>
    </div>
  </main>

</body>

</html>
