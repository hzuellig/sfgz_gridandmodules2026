<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <!-- Das Aussehen der Seite. Nicht bearbeiten. -->
  <link rel="stylesheet" href="css/basis.css">
  <style>
    .wand{
      display: grid;;
      grid-template-columns: 1fr 1fr 1fr 1fr; /* repeat(4, 1fr) */
      grid-auto-rows: 100px;
      gap:10px;
    }
    .b-gross{
      grid-column: span 2;
      grid-row: span 2;
      background-color: rgba(255,100, 20, 1);
      
    }
    .b2{
     grid-column: span 3;
      grid-row: span 2;
      background-color: rgba(10,255, 20, 0.5);
    }

    .b3{
      grid-column:2/4;
      grid-row:2/4;
    }
  </style>
</head>
<body>
    
    <div class="wand wand-2">
      <div class="b b-gross">1</div>
      <div class="b b2">2</div>
      <div class="b b3">3</div>
    <div class="b">4</div>
      <div class="b">5</div>
      <div class="b">6</div>
       <div class="b">7</div>
     
    </div>

    <h1>Hallo</h1>
</body>
</html>
